<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quà Trung Thu Cho Em Bé ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #050505;
            overflow: hidden;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #fff;
        }

        /* Màn hình mở quà (Overlay) */
        #startOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, #1a001a 0%, #050505 100%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        .gift-icon {
            font-size: 70px;
            animation: pulse 1.5s infinite ease-in-out;
            margin-bottom: 20px;
        }
        .start-text {
            font-size: 20px;
            font-weight: 600;
            color: #ffb6c1;
            text-shadow: 0 0 10px #ff69b4;
            text-align: center;
            padding: 0 20px;
            animation: blink 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .header-title {
            position: absolute;
            top: 25px;
            width: 100%;
            text-align: center;
            z-index: 10;
            font-size: 22px;
            font-weight: 600;
            color: #ffb6c1;
            text-shadow: 0 0 10px #ff69b4, 0 0 20px #ff1493;
        }

        /* Nút Bật/Tắt Nhạc */
        .music-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 105, 180, 0.25);
            border: 2px solid #ff69b4;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            backdrop-filter: blur(6px);
            box-shadow: 0 0 12px rgba(255, 20, 147, 0.5);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .music-btn.playing {
            animation: rotate 4s linear infinite;
            background: rgba(255, 20, 147, 0.6);
        }
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Màn hình chờ mở quà -->
    <div id="startOverlay">
        <div class="gift-icon">🎁</div>
        <div class="start-text">Chạm vào màn hình để mở quà nhé em bé 🥰</div>
    </div>

    <div class="header-title">Quà Trung thu cho em bé 🥰</div>
    
    <!-- Nút Bật/Tắt Nhạc -->
    <button id="musicBtn" class="music-btn">🎵</button>

    <!-- Link nhạc trực tiếp từ Catbox -->
    <audio id="bgMusic" loop src="https://files.catbox.moe/epge5d.mp3"></audio>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const messages = [
            "Tòng Như Khuyên ❤️",
            "Chúc em Trung Thu vui vẻ và ấm áp 🥰",
            "Anh yêu em bé nhiều 💕",
            "Mãi bên cạnh anh nhé 💖",
            "Nơi nào đều có 2 ta ✨"
        ];

        function heartEquation(t) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
            return { x, y };
        }

        class HeartParticle {
            constructor() {
                this.reset();
            }
            reset() {
                this.t = Math.random() * Math.PI * 2;
                const pos = heartEquation(this.t);
                const scale = Math.min(width, height) < 600 ? 8 : 12;
                this.targetX = width / 2 + pos.x * scale;
                this.targetY = height / 2 - 70 + pos.y * scale;
                
                this.x = width / 2;
                this.y = height / 2 - 70;
                
                this.speed = Math.random() * 0.04 + 0.015;
                this.size = Math.random() * 2.5 + 1;
                this.hue = Math.random() * 70 + 280;
                this.alpha = Math.random() * 0.8 + 0.2;
            }
            update() {
                this.x += (this.targetX - this.x) * this.speed;
                this.y += (this.targetY - this.y) * this.speed;
                if (Math.hypot(this.targetX - this.x, this.targetY - this.y) < 3) {
                    this.reset();
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${this.hue}, 100%, 75%, ${this.alpha})`;
                ctx.shadowBlur = 12;
                ctx.shadowColor = `hsl(${this.hue}, 100%, 60%)`;
                ctx.fill();
            }
        }

        const particleCount = width < 600 ? 350 : 600;
        const particles = Array.from({ length: particleCount }, () => new HeartParticle());

        let angle = 0;
        function draw3DText() {
            angle += 0.008;
            const centerY = height * 0.78;
            const radiusX = Math.min(width * 0.4, 280);
            const radiusY = 45;

            messages.forEach((text, i) => {
                const theta = angle + (i * (Math.PI * 2 / messages.length));
                const x = width / 2 + Math.cos(theta) * radiusX;
                const y = centerY + Math.sin(theta) * radiusY;
                const scale = (Math.sin(theta) + 2.2) / 3.2;

                ctx.save();
                ctx.font = `bold ${Math.floor(15 * scale)}px Arial`;
                ctx.fillStyle = `rgba(255, 192, 203, ${scale})`;
                ctx.shadowBlur = 10 * scale;
                ctx.shadowColor = '#ff1493';
                ctx.textAlign = 'center';
                ctx.fillText(text, x, y);
                ctx.restore();
            });
        }

        function animate() {
            ctx.fillStyle = 'rgba(5, 5, 5, 0.18)';
            ctx.fillRect(0, 0, width, height);

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            draw3DText();
            requestAnimationFrame(animate);
        }

        animate();

        // 🎵 Xử lý Tự Phát Nhạc khi chạm vào màn hình mở quà
        const startOverlay = document.getElementById('startOverlay');
        const bgMusic = document.getElementById('bgMusic');
        const musicBtn = document.getElementById('musicBtn');
        let isPlaying = false;

        startOverlay.addEventListener('click', () => {
            bgMusic.play().then(() => {
                isPlaying = true;
                musicBtn.classList.add('playing');
                musicBtn.textContent = '🎵';
            }).catch(err => {
                console.log("Lỗi phát nhạc:", err);
            });

            // Ẩn màn hình mở quà
            startOverlay.style.opacity = '0';
            startOverlay.style.visibility = 'hidden';
        });

        // Nút bật/tắt nhạc thủ công
        musicBtn.addEventListener('click', () => {
            if (isPlaying) {
                bgMusic.pause();
                musicBtn.textContent = '🔇';
                musicBtn.classList.remove('playing');
                isPlaying = false;
            } else {
                bgMusic.play().then(() => {
                    musicBtn.textContent = '🎵';
                    musicBtn.classList.add('playing');
                    isPlaying = true;
                });
            }
        });
    </script>
</body>
</html>
